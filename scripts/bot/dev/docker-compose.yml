name: auto-publisher-dev

# Any subset can be started: `backend` alone is enough for web/checkout work,
# `bot-free` pulls in proxy-free + backend + redis (minimal edition loop).

x-dev-watch-proxy: &dev-watch-proxy
  - action: sync+restart
    path: ../../apps/proxy/src
    target: /app/apps/proxy/src
    ignore:
      - "**/*.test.ts"
      - "**/*.spec.ts"
  - action: sync+restart
    path: ../../packages
    target: /app/packages
    ignore:
      - "**/node_modules/"
      - "**/dist/"
      - "**/*.test.ts"
      - "**/*.spec.ts"
  - action: rebuild
    path: ../../apps/proxy/package.json
  - action: rebuild
    path: ../../package.json
  - action: rebuild
    path: ../../bun.lock

x-dev-watch-bot: &dev-watch-bot
  - action: sync+restart
    path: ../../apps/bot/src
    target: /app/apps/bot/src
    ignore:
      - "**/*.test.ts"
      - "**/*.spec.ts"
  - action: sync+restart
    path: ../../packages
    target: /app/packages
    ignore:
      - "**/node_modules/"
      - "**/dist/"
      - "**/*.test.ts"
      - "**/*.spec.ts"
  - action: rebuild
    path: ../../apps/bot/package.json
  - action: rebuild
    path: ../../package.json
  - action: rebuild
    path: ../../bun.lock

services:
  proxy-free:
    extends:
      file: docker-compose.base.yml
      service: proxy-free
    build:
      dockerfile: apps/proxy/Dockerfile.dev
    env_file:
      - ../../.env.local
    environment:
      - APP_EDITION=free
      - NODE_ENV=development
      - LOGGER_LEVEL=debug
    depends_on:
      redis:
        condition: service_started
    ports:
      - 8081:8080 # Expose proxy for local debugging
    healthcheck:
      disable: true # Remove healthcheck for faster development startup
    command: ["bun", "run", "start"]
    develop:
      watch: *dev-watch-proxy

  proxy-premium:
    extends:
      file: docker-compose.base.yml
      service: proxy-premium
    build:
      dockerfile: apps/proxy/Dockerfile.dev
    env_file:
      - ../../.env.local
    environment:
      - APP_EDITION=premium
      - NODE_ENV=development
      - LOGGER_LEVEL=debug
    depends_on:
      redis:
        condition: service_started
    ports:
      - 8082:8080 # Expose proxy for local debugging
    healthcheck:
      disable: true # Remove healthcheck for faster development startup
    command: ["bun", "run", "start"]
    develop:
      watch: *dev-watch-proxy

  bot-free:
    extends:
      file: docker-compose.base.yml
      service: bot-free
    build:
      dockerfile: apps/bot/Dockerfile.dev
    env_file:
      - ../../.env.local
    environment:
      - APP_EDITION=free
      - NODE_ENV=development
      - LOGGER_LEVEL=debug
    depends_on:
      proxy-free:
        condition: service_started
      backend:
        condition: service_started
      redis:
        condition: service_started
    healthcheck:
      disable: true # Remove healthcheck for faster development startup
    command: ["bun", "run", "start"]
    develop:
      watch: *dev-watch-bot

  bot-premium:
    extends:
      file: docker-compose.base.yml
      service: bot-premium
    build:
      dockerfile: apps/bot/Dockerfile.dev
    env_file:
      - ../../.env.local
    environment:
      - APP_EDITION=premium
      - NODE_ENV=development
      - LOGGER_LEVEL=debug
    depends_on:
      proxy-premium:
        condition: service_started
      backend:
        condition: service_started
      redis:
        condition: service_started
    healthcheck:
      disable: true # Remove healthcheck for faster development startup
    command: ["bun", "run", "start"]
    develop:
      watch: *dev-watch-bot

  backend:
    extends:
      file: docker-compose.base.yml
      service: backend
    build:
      dockerfile: apps/backend/Dockerfile.dev
    env_file:
      - ../../.env.local
    environment:
      - NODE_ENV=development
      - LOGGER_LEVEL=debug
    depends_on:
      redis:
        condition: service_started
    ports:
      - 3101:8080 # Expose API for local development
    healthcheck:
      disable: true # Remove healthcheck for faster development startup
    command: ["bun", "run", "start"]
    develop:
      watch:
        - action: sync+restart
          path: ../../apps/backend/src
          target: /app/apps/backend/src
          ignore:
            - "**/*.test.ts"
            - "**/*.spec.ts"
        - action: sync+restart
          path: ../../packages
          target: /app/packages
          ignore:
            - "**/node_modules/"
            - "**/dist/"
            - "**/*.test.ts"
            - "**/*.spec.ts"
        - action: rebuild
          path: ../../apps/backend/package.json
        - action: rebuild
          path: ../../package.json
        - action: rebuild
          path: ../../bun.lock

  redis:
    extends:
      file: docker-compose.base.yml
      service: redis
    ports:
      - 6379:6379 # Expose Redis for local development
