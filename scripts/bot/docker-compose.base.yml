services:
  proxy-free: &proxy-base
    build:
      context: ../..
      dockerfile: apps/proxy/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env.local
    environment:
      - APP_EDITION=free
    networks:
      - ap-network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  proxy-premium:
    <<: *proxy-base
    environment:
      - APP_EDITION=premium

  bot-free: &bot-base
    build:
      context: ../..
      dockerfile: apps/bot/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env.local
    environment:
      - APP_EDITION=free
    networks:
      - ap-network
    depends_on:
      proxy-free:
        condition: service_healthy
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  bot-premium:
    <<: *bot-base
    environment:
      - APP_EDITION=premium
    depends_on:
      proxy-premium:
        condition: service_healthy
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env.local
    networks:
      - ap-network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - 6379:6379  # Only expose to localhost
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --port 6379
      --appendonly yes
      --appendfsync everysec
    networks:
      - ap-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  ap-network:
    driver: bridge
    internal: false  # Allow external access for Discord API

volumes:
  redis_data:
    driver: local
