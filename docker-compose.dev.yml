name: auto-publisher-dev

services:
  proxy:
    extends:
      file: docker-compose.base.yml
      service: proxy
    ports:
      - 8081:8080
    volumes:
      - ./services/proxy/src:/home/node/app/src
      - /home/node/app/node_modules
    healthcheck:
      disable: true
    depends_on:
      cache:
        condition: service_started

  bot:
    extends:
      file: docker-compose.base.yml
      service: bot
    build:
      dockerfile: .docker/Dockerfile.dev
    volumes:
      - ./services/bot/src:/home/node/app/src
      - /home/node/app/node_modules
    depends_on:
      proxy:
        condition: service_started

  cache:
    extends:
      file: docker-compose.base.yml
      service: cache
    ports:
      - 6379:6379

volumes:
  cache-data:
